name: Build Delta Chunk

on:
  push:
    branches:
      - main 

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NeoForge 1.21.1 mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: deltachunk-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
