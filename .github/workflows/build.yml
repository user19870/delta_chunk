name: Build Delta Chunk--multi_version

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build: 
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - minecraft: "1.21.1"
            neo: "21.1.244"
            parchment_minecraft: "1.21.1"
            parchment_mappings: "2024.11.17"
            java: "21"
          - minecraft: "26.1.2"
            neo: "26.1.2.104"
            parchment_minecraft: "26.1.2"
            parchment_mappings: "2024.11.17"
            java: "21"

    #  steps 只能出現一次，且與 strategy 靠左對齊
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      #   修正縮排與 - name 語法
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - name: Build
        run: |
          ./gradlew clean build --no-daemon \
          -Pminecraft_version=${{ matrix.minecraft }} \
          -Pneo_version=${{ matrix.neo }} \
          -Pparchment_minecraft_version=${{ matrix.parchment_minecraft }} \
          -Pparchment_mappings_version=${{ matrix.parchment_mappings }}
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: deltachunk-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
