name: Build Delta Chunk--multi_version

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build: 
    runs-on: ubuntu-latest
#按下ctrl+/可快速註解/取消註解
    strategy:
      matrix:
        include:
          # - minecraft: "1.21.1"
          #   neo: "21.1.244"
          #   parchment_minecraft: "1.21.1"
          #   parchment_mappings: "2024.11.17"
          #   java: "21"
          # - minecraft: "1.21.3"
          #   neo: "21.3.97"
          #   parchment_minecraft: "1.21.3"
          #   parchment_mappings: "2024.12.07"
          #   java: "21"
          # - minecraft: "1.21.4"
          #   neo: "21.4.157"
          #   parchment_minecraft: "1.21.4"
          #   parchment_mappings: "2025.03.23"
          #   java: "21"
          - minecraft: "1.21.5"
            neo: "21.5.98"
            parchment_minecraft: "1.21.5"
            parchment_mappings: "2025.06.15"
            java: "21"
          - minecraft: "1.21.6"
            neo: "21.6.20-beta"
            parchment_minecraft: "1.21.6"
            parchment_mappings: "2025.06.29"
            java: "21"
          - minecraft: "1.21.7"
            neo: "21.7.25-beta"
            parchment_minecraft: "1.21.7"
            parchment_mappings: "2025.07.18"
            java: "21"
          - minecraft: "1.21.8"
            neo: "21.8.54"
            parchment_minecraft: "1.21.8"
            parchment_mappings: "2025.09.14"
            java: "21"
          - minecraft: "1.21.9"
            neo: "21.9.16-beta"
            parchment_minecraft: "1.21.9"
            parchment_mappings: "2025.10.05"
            java: "21"

    #  steps 只能出現一次，且與 strategy 靠左對齊
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      #   修正縮排與 - name 語法
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - name: Build
        run: |
          ./gradlew clean build --no-daemon --no-configuration-cache \
          -Pminecraft_version=${{ matrix.minecraft }} \
          -Pneo_version=${{ matrix.neo }} \
          -Pparchment_minecraft_version=${{ matrix.parchment_minecraft }} \
          -Pparchment_mappings_version=${{ matrix.parchment_mappings }}
      - name: Prepare mod JAR
        run: |
          mkdir -p artifacts
           for file in build/libs/*.jar; do
              mv "$file" "${file%.jar}-${{ matrix.minecraft }}.jar"
              cp build/libs/*.jar artifacts/
             done
      - name: Upload version JAR
        uses: actions/upload-artifact@v4
        with:
            name: deltachunk-jar-${{ matrix.minecraft }}
            path: build/libs/*.jar
            if-no-files-found: error

     

  package:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all version JARs
        uses: actions/download-artifact@v4
        with:
          pattern: deltachunk-jar-*
          path: artifacts
          merge-multiple: true

      - name: Create ZIP
        run: |
          cd artifacts
          zip "../deltachunk-${{ github.sha }}.zip" *.jar

      - name: Upload combined ZIP
        uses: actions/upload-artifact@v4
        with:
          name: deltachunk-${{ github.sha }}
          path: deltachunk-${{ github.sha }}.zip
          if-no-files-found: error
